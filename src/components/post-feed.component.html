<div class="p-2 space-y-3">
  <!-- Suggested Friends -->
  @if (suggestedUsers().length > 0) {
    <div class="bg-white rounded-xl shadow-md p-3">
      <h3 class="text-sm font-bold text-gray-800 mb-2">Suggested Friends</h3>
      <div class="flex space-x-3 overflow-x-auto pb-1">
        @for (user of suggestedUsers(); track user.id) {
          <div class="flex flex-col items-center min-w-[80px]">
            <img [src]="user.avatar" [alt]="user.name" class="w-12 h-12 rounded-full mb-1">
            <p class="text-xs font-semibold text-gray-800 truncate w-full text-center">{{ user.name }}</p>
            @if (addedIds().has(user.id)) {
              <span class="mt-1 px-3 py-0.5 text-xs font-semibold text-emerald-700 bg-emerald-50 border border-emerald-200 rounded-full">Added</span>
            } @else {
              <button (click)="addFriend(user)" class="mt-1 px-3 py-0.5 text-xs font-semibold text-white bg-[#1A4D2E] rounded-full hover:bg-[#4F6F52]">Add</button>
            }
          </div>
        }
      </div>
    </div>
  }

  <!-- Posts -->
  @for (post of posts(); track post.id) {
    <app-post [post]="post" (profileClicked)="profileClicked.emit()"></app-post>
  }

  @if (posts().length === 0) {
    <div class="text-center py-12 text-gray-400">
      <p class="text-lg font-semibold mb-1">No posts yet</p>
      <p class="text-sm">Be the first to share something!</p>
    </div>
  }
</div>
